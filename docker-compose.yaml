services:
  db:
    image: postgres:18
    container_name: gnome-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: gnomo
      POSTGRES_PASSWORD: gnomo
      POSTGRES_DB: gnome_db
    ports:
      - "5438:5432"
    volumes:
      # CRITICAL: Mount to the base directory for PostgreSQL 18+ compatibility
      - postgres_data:/var/lib/postgresql
  test_db:
    image: postgres:18
    container_name: test-gnome-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: gnomo
      POSTGRES_PASSWORD: gnomo
      POSTGRES_DB: test_gnome_db
    ports:
      - "5439:5432"
    volumes:
      # CRITICAL: Mount to the base directory for PostgreSQL 18+ compatibility
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
