  "@types/node": ^26.6.6
  eslint: ^10.14.0
  eslint-plugin-react-hooks: ^7.1.1
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  typescript-eslint: ^8.72.1
  vite: ^8.3.5

allowBuilds:
  '@openapitools/openapi-generator-cli': false
  "@prisma/engines": true
  esbuild: true
  prisma: true
